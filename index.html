<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>在庫管理</title>
  <style>
    :root{
      --bg:#f3f4f6; --card:#fff; --text:#111827; --sub:#6b7280;
      --line:#e5e7eb; --primary:#2563eb; --danger:#dc2626; --ok:#059669;
      --shadow:0 8px 24px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg); color:var(--text);
    }
    header{
      position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line);
      padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    }
    h1{font-size:22px;margin:0}
    .wrap{max-width:780px;margin:0 auto;padding:18px}
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:18px;
      padding:18px; box-shadow:var(--shadow); margin-bottom:16px;
    }
    .hidden{display:none!important}
    label{display:block;font-weight:700;margin:12px 0 6px}
    input{
      width:100%; padding:14px 15px; border:1px solid #cbd5e1; border-radius:12px;
      font-size:16px; background:#fff;
    }
    button{
      border:0; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:700;
      cursor:pointer;
    }
    .primary{background:var(--primary);color:white}
    .secondary{background:#e5e7eb;color:#111827}
    .danger{background:#fee2e2;color:#991b1b}
    .small{padding:9px 12px;font-size:14px}
    .row{display:flex;gap:10px;align-items:center}
    .grow{flex:1}
    .muted{color:var(--sub);font-size:14px}
    .status{margin-top:10px;font-size:14px}
    .status.bad{color:var(--danger)}
    .status.ok{color:var(--ok)}
    .toolbar{display:flex;gap:10px;margin-bottom:14px}
    .toolbar input{margin:0}
    .item{
      display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center;
      padding:14px 0; border-bottom:1px solid var(--line);
    }
    .item:last-child{border-bottom:0}
    .name{font-weight:800;font-size:17px}
    .qty{font-size:14px;color:var(--sub);margin-top:4px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .empty{text-align:center;color:var(--sub);padding:28px 8px}
    dialog{
      width:min(92vw,520px); border:0; border-radius:18px; padding:0; box-shadow:0 24px 60px rgba(0,0,0,.2)
    }
    dialog::backdrop{background:rgba(0,0,0,.35)}
    .dialog-inner{padding:20px}
    .top-actions{display:flex;gap:8px;align-items:center}
    .badge{
      display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;
      padding:4px 8px;font-size:12px;font-weight:700;margin-left:6px;
    }
    @media(max-width:560px){
      .wrap{padding:14px}
      .item{grid-template-columns:1fr}
      .actions{justify-content:flex-start}
      header{padding:14px}
    }
  </style>
</head>
<body>
<header>
  <h1>📦 在庫管理</h1>
  <div class="top-actions">
    <span id="onlineBadge" class="badge hidden">接続中</span>
    <button id="logoutBtn" class="secondary small hidden">ログアウト</button>
  </div>
</header>

<main class="wrap">
  <section id="loginPanel" class="card">
    <h2 style="margin-top:0">スタッフ共通ログイン</h2>
    <p class="muted">共通パスワードだけ入力してください。</p>
    <form id="loginForm">
      <label for="password">共通パスワード</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div style="margin-top:14px">
        <button class="primary" type="submit">ログイン</button>
      </div>
    </form>
    <div id="loginStatus" class="status"></div>
  </section>

  <section id="appPanel" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <h2 style="margin:0 0 4px">在庫一覧</h2>
          <div class="muted">追加・変更・削除は全員に反映されます。</div>
        </div>
        <button id="addBtn" class="primary small">＋ 追加</button>
      </div>

      <div class="toolbar" style="margin-top:16px">
        <input id="search" class="grow" placeholder="商品名で検索">
      </div>

      <div id="items"></div>
    </div>
  </section>
</main>

<dialog id="editor">
  <div class="dialog-inner">
    <h2 id="editorTitle" style="margin-top:0">商品を追加</h2>
    <form id="itemForm">
      <input id="editId" type="hidden">
      <label for="itemName">商品名</label>
      <input id="itemName" required maxlength="80">

      <label for="itemQty">在庫数</label>
      <input id="itemQty" type="number" min="0" step="1" required>

      <div class="row" style="margin-top:18px;justify-content:flex-end">
        <button id="cancelEdit" class="secondary" type="button">キャンセル</button>
        <button class="primary" type="submit">保存</button>
      </div>
    </form>
  </div>
</dialog>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
    onSnapshot, serverTimestamp, query, orderBy
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDrIO42RKi0oyjkXO-z3uH7eJcuLR8_Ils",
    authDomain: "zaiko-c706e.firebaseapp.com",
    projectId: "zaiko-c706e",
    storageBucket: "zaiko-c706e.firebasestorage.app",
    messagingSenderId: "282569206342",
    appId: "1:282569206342:web:bc58b45703daa7a76cb847",
    measurementId: "G-BMPL6LVV1W"
  };

  // Firebase Authentication に作成済みのスタッフ用ユーザー
  const SHARED_LOGIN_EMAIL = "kurousagiseira+staff@gmail.com";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  let inventory = [];
  let unsubscribe = null;

  function setLoginStatus(text, bad=false){
    $("loginStatus").textContent = text;
    $("loginStatus").className = "status " + (bad ? "bad" : "ok");
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = $("password").value;
    setLoginStatus("ログイン中...");
    try{
      await signInWithEmailAndPassword(auth, SHARED_LOGIN_EMAIL, password);
      $("password").value = "";
      setLoginStatus("");
    }catch(err){
      console.error(err);
      setLoginStatus("ログインできません。共通パスワードを確認してください。", true);
    }
  });

  $("logoutBtn").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if(user){
      $("loginPanel").classList.add("hidden");
      $("appPanel").classList.remove("hidden");
      $("logoutBtn").classList.remove("hidden");
      $("onlineBadge").classList.remove("hidden");
      startInventorySync();
    }else{
      $("loginPanel").classList.remove("hidden");
      $("appPanel").classList.add("hidden");
      $("logoutBtn").classList.add("hidden");
      $("onlineBadge").classList.add("hidden");
      if(unsubscribe){ unsubscribe(); unsubscribe = null; }
      inventory = [];
      renderItems();
    }
  });

  function startInventorySync(){
    if(unsubscribe) unsubscribe();
    const q = query(collection(db,"inventory"), orderBy("name"));
    unsubscribe = onSnapshot(q, (snap) => {
      inventory = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      renderItems();
    }, (err) => {
      console.error(err);
      $("items").innerHTML = '<div class="empty">在庫データを読み込めませんでした。Firestoreのルールを確認してください。</div>';
    });
  }

  function renderItems(){
    const term = $("search").value.trim().toLowerCase();
    const list = inventory.filter(x => String(x.name || "").toLowerCase().includes(term));
    if(!list.length){
      $("items").innerHTML = '<div class="empty">商品がありません。</div>';
      return;
    }

    $("items").innerHTML = list.map(x => `
      <div class="item">
        <div>
          <div class="name">${escapeHtml(x.name)}</div>
          <div class="qty">在庫：${Number(x.quantity ?? 0)} 個</div>
        </div>
        <div class="actions">
          <button class="secondary small" data-edit="${x.id}">編集</button>
          <button class="danger small" data-delete="${x.id}">削除</button>
        </div>
      </div>
    `).join("");
  }

  $("search").addEventListener("input", renderItems);

  $("items").addEventListener("click", async (e) => {
    const editId = e.target.dataset.edit;
    const deleteId = e.target.dataset.delete;

    if(editId){
      const item = inventory.find(x => x.id === editId);
      if(!item) return;
      $("editorTitle").textContent = "商品を編集";
      $("editId").value = item.id;
      $("itemName").value = item.name ?? "";
      $("itemQty").value = Number(item.quantity ?? 0);
      $("editor").showModal();
    }

    if(deleteId){
      const item = inventory.find(x => x.id === deleteId);
      if(!item) return;
      if(confirm(`「${item.name}」を削除しますか？`)){
        await deleteDoc(doc(db,"inventory",deleteId));
      }
    }
  });

  $("addBtn").addEventListener("click", () => {
    $("editorTitle").textContent = "商品を追加";
    $("editId").value = "";
    $("itemName").value = "";
    $("itemQty").value = 0;
    $("editor").showModal();
  });

  $("cancelEdit").addEventListener("click", () => $("editor").close());

  $("itemForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = $("editId").value;
    const name = $("itemName").value.trim();
    const quantity = Number($("itemQty").value);

    if(!name) return;
    if(!Number.isInteger(quantity) || quantity < 0){
      alert("在庫数は0以上の整数にしてください。");
      return;
    }

    if(id){
      await updateDoc(doc(db,"inventory",id), {
        name, quantity, updatedAt: serverTimestamp()
      });
    }else{
      await addDoc(collection(db,"inventory"), {
        name, quantity,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    }

    $("editor").close();
  });

  function escapeHtml(v){
    return String(v ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>
</body>
</html>
